# Build the Vue store-front with the backend URLs baked in, then deploy the dist folder to Azure Web App

name: Build and deploy Vue store-front to Azure Web App - store-front-ngepi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env: # Declare environment variables here (baked into the JavaScript at build time)
      VUE_APP_ORDER_SERVICE_URL: https://order-service-ngepi-ebcbefeqdffnddbt.swedencentral-01.azurewebsites.net
      VUE_APP_PRODUCT_SERVICE_URL: https://product-service-ngepi-azhhe8cncde6cxc5.swedencentral-01.azurewebsites.net

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: npm ci and build
        run: |
          npm ci
          npm run build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: vue-dist
          path: dist

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: vue-dist

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'store-front-ngepi'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
